spring:
  application:
    name:staffcontrol

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # или validate/none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:212.112.121.115}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:rabbit_test}
    password: ${RABBITMQ_PASSWORD:FdO6C8xVL47B}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Настройки для автоматического переподключения
    connection-timeout: 60000
    requested-heart-beat: 60
    # Настройки для обработки ошибок
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.0
          max-interval: 10000
        default-requeue-rejected: false
    # Настройки для автоматического восстановления соединения
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        multiplier: 1.0
        max-interval: 10000
jwt:
  secret: N9tpPCXDKyqE61fYlnbsQM3a9yW7bAle
  expirationAccessTokenTime: 360000000
  expirationRefreshTokenTime: 864000000

logging:
  level:
    org.springframework: debug
    org.hibernate.SQL: debug
    org.springframework.web: trace
    org.springframework.security: debug
    kg.mlsp.staffcontrol: debug
    org.springframework.amqp: DEBUG
    com.rabbitmq: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/full-debug.log

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /v3/api-docs
    path: /api/docs
    persist-authorization: true

server:
  forward-headers-strategy: native
